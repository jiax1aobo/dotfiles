theme = "gruvbox"

[editor]
line-number = "relative"
cursorline = true
auto-format = false
trim-trailing-whitespace = true
popup-border = "popup"
bufferline = "multiple"
color-modes = true

[editor.statusline]
right = ["diagnostics", "register", "primary-selection-length", "position", "position-percentage", "file-encoding"]

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.indent-guides]
render = true
skip-levels = 1

[editor.soft-wrap]
enable = true

[editor.lsp]
display-inlay-hints = true
